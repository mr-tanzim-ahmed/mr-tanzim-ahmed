<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title description">
  <title id="title">Tanzim Ahmed — Software QA Engineer and WordPress Developer</title>
  <desc id="description">A profile banner representing a design, develop, and test workflow across WordPress development and software quality assurance.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b33" />
      <stop offset="0.58" stop-color="#172c3c" />
      <stop offset="1" stop-color="#123b3b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#60a5fa" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.26" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#dbeafe" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
    <style>
      @keyframes drift {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-9px); }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.9; }
      }
      @keyframes travel {
        to { stroke-dashoffset: -160; }
      }
      .drift { animation: drift 7s ease-in-out infinite; }
      .drift-two { animation: drift 7s ease-in-out -2.3s infinite; }
      .drift-three { animation: drift 7s ease-in-out -4.6s infinite; }
      .breathe { animation: breathe 4s ease-in-out infinite; }
      .travel { animation: travel 18s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .drift, .drift-two, .drift-three, .breathe, .travel { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="270" rx="24" fill="url(#background)" />
  <rect width="1200" height="270" rx="24" fill="url(#grid)" />
  <ellipse cx="985" cy="135" rx="250" ry="180" fill="url(#halo)" />

  <g fill="none" stroke="url(#accent)" stroke-linecap="round">
    <path class="travel" d="M690 224H830l28-28h82l24-24h166" stroke-dasharray="4 12" stroke-opacity="0.6" stroke-width="2" />
    <path d="M760 68h72l24 24h60" stroke-opacity="0.25" stroke-width="1.5" />
    <path d="M1050 54v26l-18 18" stroke-opacity="0.25" stroke-width="1.5" />
  </g>

  <path class="travel" d="M790 126H1090" fill="none" stroke="url(#accent)" stroke-dasharray="4 10" stroke-opacity="0.55" stroke-width="2" />

  <g class="drift">
    <circle cx="790" cy="126" r="48" fill="#142b3b" stroke="#99f6e4" stroke-opacity="0.2" />
    <circle cx="790" cy="126" r="36" fill="#173746" stroke="#5eead4" stroke-opacity="0.55" />
    <rect x="779" y="110" width="22" height="29" rx="3" fill="none" stroke="#d1fae5" stroke-width="2" />
    <path d="M784 118h12m-12 6h12m-12 6h8" stroke="#99f6e4" stroke-linecap="round" stroke-width="2" />
    <circle class="breathe" cx="821" cy="95" r="3" fill="#67e8f9" />
  </g>
  <g class="drift-two">
    <circle cx="940" cy="126" r="48" fill="#142b3b" stroke="#99f6e4" stroke-opacity="0.2" />
    <circle cx="940" cy="126" r="36" fill="#173746" stroke="#5eead4" stroke-opacity="0.55" />
    <path d="m933 116-9 10 9 10m14-20 9 10-9 10m-1-24-12 28" fill="none" stroke="#d1fae5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
    <circle class="breathe" cx="971" cy="157" r="3" fill="#a5b4fc" />
  </g>
  <g class="drift-three">
    <circle cx="1090" cy="126" r="48" fill="#142b3b" stroke="#99f6e4" stroke-opacity="0.2" />
    <circle cx="1090" cy="126" r="36" fill="#173746" stroke="#5eead4" stroke-opacity="0.55" />
    <path d="m1075 126 10 10 21-23" fill="none" stroke="#d1fae5" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" />
    <circle class="breathe" cx="1121" cy="95" r="3" fill="#67e8f9" />
  </g>
  <text x="790" y="195" fill="#b9f5eb" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4" text-anchor="middle">DESIGN</text>
  <text x="940" y="195" fill="#b9f5eb" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4" text-anchor="middle">DEVELOP</text>
  <text x="1090" y="195" fill="#b9f5eb" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4" text-anchor="middle">TEST</text>

  <rect x="68" y="54" width="350" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#99f6e4" stroke-opacity="0.25" />
  <circle class="breathe" cx="88" cy="69" r="4" fill="#5eead4" />
  <text x="102" y="74" fill="#b9f5eb" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.8">MANUAL &amp; AUTOMATION TESTING</text>

  <text x="68" y="151" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">Tanzim Ahmed</text>
  <text x="72" y="190" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="1.1">SOFTWARE QA ENGINEER  /  WORDPRESS DEVELOPER</text>
  <rect x="70" y="222" width="210" height="3" rx="1.5" fill="url(#accent)" />
  <rect x="288" y="222" width="54" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.16" />
</svg>
